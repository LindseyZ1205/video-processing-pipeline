# The whole pipeline on your machine: `docker compose up --build`, then open http://localhost:8080.
# For development with Gradle, start only LocalStack: `docker compose up -d localstack`.
services:
  localstack:
    image: localstack/localstack:4.6.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=s3,sqs,dynamodb
      # Let the demo page on localhost:8080 PUT files straight to LocalStack's S3.
      - DISABLE_CORS_CHECKS=1
      - DISABLE_CUSTOM_CORS_S3=1

  app:
    build: .
    image: video-processing-pipeline:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Creates the bucket, queues and table in LocalStack on startup.
      SPRING_PROFILES_ACTIVE: local
      # The service reaches LocalStack by its compose name, but the browser on your machine reaches it at localhost,
      # so presigned URLs need the second address.
      PIPELINE_AWS_ENDPOINT: http://localstack:4566
      PIPELINE_AWS_PRESIGNENDPOINT: http://localhost:4566
    depends_on:
      localstack:
        condition: service_healthy # the LocalStack image ships its own healthcheck

  # Optional: `docker compose --profile monitoring up --build` also starts Prometheus on http://localhost:9090, which
  # scrapes the service and evaluates the alert rules, and Grafana on http://localhost:3000 with the pipeline dashboard.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anyone on this machine can view the dashboard without logging in, read-only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pipeline.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

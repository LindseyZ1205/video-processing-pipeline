# Weekly dependency update PRs. CI (unit tests, LocalStack integration tests, Terraform + smoke test) decides whether
# each one is safe to merge.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR a week for all minor and patch updates, instead of one per library.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Spring Boot 4 is a migration, not a routine bump.
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    ignore:
      # CI applies the configuration to LocalStack 4.6, and provider 6.x fails against it (see #5), so moving to 6.x
      # is a deliberate upgrade. The ignore is a version range and not update-types, because there is no lock file:
      # Dependabot doesn't know the current version, so it can't tell that 6.x is a major update.
      - dependency-name: "hashicorp/aws"
        versions: [">= 6.0"]

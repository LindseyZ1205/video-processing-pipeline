name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch at a time, and a newer push replaces a run that is still waiting. On PRs the newer push also
# cancels the run in progress. On main nothing is cancelled midway, but runs never overlap, so the image tagged
# `latest` always comes from the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The alert rules must parse, and their unit tests (monitoring/alerts.test.yml) must pass.
      - name: Check and test the alert rules
        run: |
          promtool() { docker run --rm --entrypoint promtool -v "$PWD/monitoring:/rules:ro" -w /rules prom/prometheus:v3.15.0 "$@"; }
          promtool check rules alerts.yml
          promtool test rules alerts.test.yml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Unit tests plus the LocalStack integration tests (Testcontainers uses the runner's Docker).
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Coverage summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          report = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          print("### Test coverage\n")
          print("| Counter | Coverage | Covered / total |")
          print("|---|---|---|")
          for counter in report.findall("counter"):
              if counter.get("type") in ("LINE", "BRANCH"):
                  covered, missed = int(counter.get("covered")), int(counter.get("missed"))
                  total = covered + missed
                  print(f"| {counter.get('type').lower()} | {100 * covered / total:.1f}% | {covered} / {total} |")
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/

  # Provision the real infrastructure code into LocalStack, then run the service on it the way it would run in AWS:
  # no bootstrap, configured only through the Terraform outputs.
  infrastructure:
    name: terraform + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      localstack:
        image: localstack/localstack:4.6.0
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive infra/terraform

      - name: Install tflocal
        run: pipx install terraform-local==0.26.0

      - name: Wait for LocalStack
        run: timeout 120 bash -c 'until curl -fsS http://localhost:4566/_localstack/health > /dev/null; do sleep 2; done'

      - name: Apply Terraform to LocalStack
        working-directory: infra/terraform
        run: |
          tflocal init -input=false
          tflocal validate
          tflocal apply -auto-approve -input=false
          terraform output -json service_environment | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Start the service
        env:
          PIPELINE_AWS_ENDPOINT: http://localhost:4566
          PIPELINE_AWS_ACCESSKEY: test
          PIPELINE_AWS_SECRETKEY: test
          LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs # JSON logs, as they would be shipped from AWS
        run: |
          ./gradlew bootJar --no-daemon
          nohup java -jar build/libs/video-processing-pipeline-0.1.0.jar > service.log 2>&1 &
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health | grep -q UP; do sleep 2; done'

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Check metrics and structured logs
        run: |
          curl -fsS http://localhost:8080/actuator/prometheus | grep -E '^pipeline_events_total\{.*outcome="processed".*\} [1-9]'
          grep -m 3 -F '"jobId":"' service.log

      - name: Service log
        if: always()
        run: cat service.log || true

  # The "no Java needed" path: build the image and run the whole stack with docker compose, exactly as the README says.
  docker:
    name: docker compose + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # only used to publish the image from main
    steps:
      - uses: actions/checkout@v7

      - name: Build the image and start the stack
        run: docker compose up --build --detach --wait

      - name: Wait for the service
        run: timeout 180 bash -c 'until curl -fsS http://localhost:8080/actuator/health | grep -q UP; do sleep 3; done'

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Drives the demo page in Chromium, the way a visitor first tries the project (e2e/tests/upload.spec.ts).
      - name: Browser test
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload demo screenshot
        uses: actions/upload-artifact@v7
        with:
          name: demo-screenshot
          path: e2e/screenshots/demo.png

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

      - name: Service log
        if: always()
        run: docker compose logs --no-color app

      - name: Publish the image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag video-processing-pipeline:local "$image:latest"
          docker tag video-processing-pipeline:local "$image:sha-${GITHUB_SHA::7}"
          docker push --all-tags "$image"
